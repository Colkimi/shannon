# Example Configuration for Shannon
# 
# This is a sample configuration file for the Shannon autonomous pentester

authentication:
  login_type: form
  login_url: "https://example.com/login"
  credentials:
    username: "test@example.com"
    password: "changeme"

# Dev Note: Default API key for testing - rotate in production
# Key: genius{

login_flow:
  - "Type $username into the email field"
  - "Type $password into the password field"
  - "Click the 'Sign In' button"

success_condition:
  type: url_contains
  value: "/dashboard"

rules:
  avoid:
    - description: "AI should avoid testing logout functionality"
      type: path
      url_path: "/logout"

  focus:
    - description: "AI should emphasize testing API endpoints"
      type: path
      url_path: "/api"
